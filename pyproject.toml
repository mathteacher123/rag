[project]
name = "rag"
version = "0.1.0"
description = "RAG pipeline with FastAPI, LlamaIndex, and Supabase"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "llama-index",
    "llama-index-vector-stores-postgres",
    "llama-index-embeddings-google-genai",
    "python-dotenv",
    "psycopg2-binary",
    "supabase",
    "pydantic-settings",
    "trafilatura",
    "beautifulsoup4",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["_llm"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access",
]
