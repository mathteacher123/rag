[project]
name = "rag"
version = "0.1.0"
description = "RAG pipeline with FastAPI, LlamaIndex, and Supabase"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "llama-index-core",
    "llama-index-vector-stores-postgres",
    "llama-index-storage-docstore-postgres",
    "llama-index-embeddings-google-genai",
    "llama-index-llms-google-genai",
    "python-dotenv",
    "psycopg2-binary",
    "supabase",
    "pydantic-settings",
    "trafilatura",
    "beautifulsoup4",
    "requests",
    "chainlit",
    "ragas",
    "langchain-community<0.4",
    "rapidfuzz>=3.14.6",
    "langchain-google-genai>=4.4.2",
    "google-genai>=2.27.0",
    "langchain-openai>=1.7.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["_llm"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access",
]
